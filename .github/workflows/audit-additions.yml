name: Audit Security Additions

# Additive security gates not covered by the org's reusable security
# workflow (security.yml):
#   - actionlint: workflow syntax validation
#   - scorecards: supply-chain risk on third-party actions (weekly)
#
# osv-scanner was removed here: bigknoxy/.github's security-reusable.yml
# now runs gitleaks, codeql, dependency-review, and npm audit (dep-audit)
# via security.yml, which covers dependency vulnerability scanning.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/al.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/al.tar.gz -C /tmp actionlint
      - name: Run actionlint on all workflows
        # Check all workflow files (this repo owns them, unlike in PRs
        # from forks where we restrict to PR-added files).
        run: /tmp/actionlint -color -shellcheck=SC2015,SC2016,SC2046,SC2086 .github/workflows/*.yml

  scorecards:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    name: scorecards
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Scorecards
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: scorecard-results.sarif
